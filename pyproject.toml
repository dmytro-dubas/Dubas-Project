[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-toolkit"
version = "1.0.1"
description = "Інструменти для мови SIPL: парсер, семантичні терми, обчислення, перевірка коректності циклів"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Дубас Дмитро Олександрович"}
]
keywords = ["sipl", "formal-semantics", "parser", "verifier"]
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sipl = ["*.lark"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -q --disable-warnings"
pythonpath = ["src"]
